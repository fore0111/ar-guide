<!doctype html><meta charset="utf-8"><title>compile</title>
<script type="module">
import { Compiler } from '../vendor/mindar-image.prod.js';
const load = (src) => new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = src; });
window.compilePoint = async (files) => {
  const images = await Promise.all(files.map((f) => load('../targets/' + f)));
  const compiler = new Compiler();
  await compiler.compileImageTargets(images, (p) => console.log('progress ' + p.toFixed(0)));
  const buf = await compiler.exportData();
  let s = ''; const u8 = new Uint8Array(buf);
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
};
window.ready = true;
</script>
