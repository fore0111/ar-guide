<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAsVI ARガイド PV</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 13px -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; }
  #wrap { flex: 1; display: grid; place-items: center; min-height: 0; }
  canvas { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #000; }
  #ui { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: #111; }
  #ui button { background: #e6007e; color: #fff; border: 0; border-radius: 6px; padding: 6px 14px; font: inherit; font-weight: 700; }
  #seek { flex: 1; accent-color: #e6007e; }
  #tc { font-family: Menlo, monospace; min-width: 90px; }
  body.render #ui { display: none; }
  body.render canvas { max-width: none; max-height: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="1920" height="1080"></canvas></div>
<div id="ui"><button id="play">再生</button><input id="seek" type="range" min="0" max="31" step="0.0333" value="0"><span id="tc">0.00s</span></div>
<script type="module" src="pv.js"></script>
</body>
</html>
